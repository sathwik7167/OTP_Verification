<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure OTP Verification</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="icon" aria-hidden="true">🔐</div>
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>OTP Verification</h1>
      <p class="subtitle">Verify your mobile number with a one-time password.</p>

      <form id="otp-form">
        <label for="phone">Mobile number</label>
        <input id="phone" name="phone" type="tel" inputmode="tel"
               autocomplete="tel" placeholder="e.g. +919876543210"
               maxlength="16" required>
        <button id="request-btn" type="button">Send OTP</button>

        <div class="otp-area">
          <label for="otp">6-digit OTP</label>
          <input id="otp" name="otp" type="text" inputmode="numeric"
                 autocomplete="one-time-code" placeholder="Enter OTP"
                 maxlength="6" pattern="[0-9]{6}" required>
          <button id="verify-btn" type="submit" class="verify">Verify OTP</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="timer" class="timer"></p>
      <p class="demo-note"><strong>Demo:</strong> The OTP appears in the backend terminal, not by SMS.</p>
    </section>
    <footer>OTP valid for 2 minutes · Maximum 3 attempts</footer>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
